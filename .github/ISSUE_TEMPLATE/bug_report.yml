name: Ошибка
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Компонент
      options:
        - Мобильное приложение
        - Веб-панель
        - API
        - Общий пакет
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Роль пользователя
      placeholder: STUDENT, ADMIN или LEADERSHIP
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Укажите точную последовательность действий.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Конфиденциальность
      options:
        - label: В описании и вложениях нет реальных персональных данных или секретов
          required: true
